# Local development and production-image testing (docs/SPEC.md section 21).
#   docker compose up -d db      Postgres for `npm run dev`
#   docker compose --profile app up --build   the production image on http://localhost:3000
# Production uses deploy/compose.yaml instead (docs/deploy.md).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: simpledash
      POSTGRES_PASSWORD: simpledash
      POSTGRES_DB: simpledash
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simpledash"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_URL: http://localhost:3000
    env_file: .env
    environment:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://simpledash:simpledash@db:5432/simpledash
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

volumes:
  db-data:
